<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="mblm_r2_section_master" data-pptx-master-name="MBLM R2 Section" data-pptx-layout="section_agenda" data-pptx-layout-name="Section Agenda" data-pptx-page-role="section">
  <defs>
